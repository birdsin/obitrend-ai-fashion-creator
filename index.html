<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>OBITREND – AI Fashion Studio</title>

        <style>
            * {
                  box-sizing: border-box;
                      }

                          body {
                                margin: 0;
                                      padding: 20px;
                                            font-family: Arial, Helvetica, sans-serif;
                                                  background: #f7f5f0;
                                                        color: #111;
                                                            }

                                                                .upload-box {
                                                                      max-width: 600px;
                                                                            margin: 40px auto;
                                                                                  padding: 30px;
                                                                                        background: white;
                                                                                              border: 2px dashed #d8c9a8;
                                                                                                    border-radius: 20px;
                                                                                                          text-align: center;
                                                                                                              }

                                                                                                                  .upload-box h2 {
                                                                                                                        margin-top: 0;
                                                                                                                            }

                                                                                                                                #garment {
                                                                                                                                      display: block;
                                                                                                                                            width: 100%;
                                                                                                                                                  margin: 20px 0;
                                                                                                                                                        padding: 15px;
                                                                                                                                                              border: 1px solid #ddd;
                                                                                                                                                                    border-radius: 10px;
                                                                                                                                                                        }

                                                                                                                                                                            #preview {
                                                                                                                                                                                  display: none;
                                                                                                                                                                                        width: 100%;
                                                                                                                                                                                              max-width: 100%;
                                                                                                                                                                                                    height: auto;
                                                                                                                                                                                                          max-height: 500px;
                                                                                                                                                                                                                object-fit: contain;
                                                                                                                                                                                                                      margin: 20px auto 0;
                                                                                                                                                                                                                            border-radius: 16px;
                                                                                                                                                                                                                                  background: #f1f1f1;
                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                          #preview.show {
                                                                                                                                                                                                                                                display: block;
                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                        #fileName {
                                                                                                                                                                                                                                                              margin-top: 10px;
                                                                                                                                                                                                                                                                    font-size: 14px;
                                                                                                                                                                                                                                                                          color: #666;
                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                                                </head>

                                                                                                                                                                                                                                                                                <body>

                                                                                                                                                                                                                                                                                  <div class="upload-box">

                                                                                                                                                                                                                                                                                      <h1>OBITREND</h1>
                                                                                                                                                                                                                                                                                          <p>AI FASHION STUDIO</p>

                                                                                                                                                                                                                                                                                              <h2>Upload your clothing</h2>

                                                                                                                                                                                                                                                                                                  <p>PNG, JPG or WEBP</p>
                                                                                                                                                                                                                                                                                                      <p>Maximum 12 MB</p>

                                                                                                                                                                                                                                                                                                          <input
                                                                                                                                                                                                                                                                                                                type="file"
                                                                                                                                                                                                                                                                                                                      id="garment"
                                                                                                                                                                                                                                                                                                                            accept="image/png,image/jpeg,image/webp"
                                                                                                                                                                                                                                                                                                                                >

                                                                                                                                                                                                                                                                                                                                    <div id="fileName"></div>

                                                                                                                                                                                                                                                                                                                                        <img
                                                                                                                                                                                                                                                                                                                                              id="preview"
                                                                                                                                                                                                                                                                                                                                                    alt="Clothing preview"
                                                                                                                                                                                                                                                                                                                                                        >
<button id="generateBtn" type="button">
        Generate Fashion
        </button>
                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                            <script>
                                                                                                                                                                                                                                                                                                                                                                document.addEventListener("DOMContentLoaded", function () {

                                                                                                                                                                                                                                                                                                                                                                      const garment = document.getElementById("garment");
                                                                                                                                                                                                                                                                                                                                                                            const preview = document.getElementById("preview");
                                                                                                                                                                                                                                                                                                                                                                                  const fileName = document.getElementById("fileName");

                                                                                                                                                                                                                                                                                                                                                                                        garment.addEventListener("change", function (event) {

                                                                                                                                                                                                                                                                                                                                                                                                const file = event.target.files[0];

                                                                                                                                                                                                                                                                                                                                                                                                        if (!file) {
                                                                                                                                                                                                                                                                                                                                                                                                                  preview.src = "";
                                                                                                                                                                                                                                                                                                                                                                                                                            preview.classList.remove("show");
                                                                                                                                                                                                                                                                                                                                                                                                                                      fileName.textContent = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                fileName.textContent = "Selected: " + file.name;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const imageURL = URL.createObjectURL(file);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                preview.src = imageURL;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        preview.classList.add("show");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                preview.onload = function () {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          URL.revokeObjectURL(imageURL);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </script>
<script src="app.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </html>
